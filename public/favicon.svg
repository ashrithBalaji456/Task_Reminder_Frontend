  <path d="M256 128c-44.2 0-80 35.8-80 80v56.6c0 14.6-5.8 28.5-16.2 38.8l-15.6 15.6c-12.6 12.6-3.7 34.2 14.1 34.2h195.4c17.8 0 26.7-21.6 14.1-34.2l-15.6-15.6c-10.4-10.3-16.2-24.2-16.2-38.8V208c0-44.2-35.8-80-80-80z" fill="#ffffff" opacity="0.95"/>
  <path d="M208 368c4.2 22.6 24.1 40 48 40s43.8-17.4 48-40h-96z" fill="#ffffff" opacity="0.95"/>

